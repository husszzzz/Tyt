<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مفتش المواقع | الحسني</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050507;
            --card: #0f0f15;
            --accent: #9333ea;
            --cyan: #00e5ff;
            --white: #ffffff;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--white);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            border: 1px solid #1e1e2d;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin: 0;
            background: linear-gradient(90deg, var(--cyan), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            background: #161621;
            border: 1px solid #2d2d3f;
            padding: 15px;
            border-radius: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        button {
            background: linear-gradient(90deg, var(--accent), #6366f1);
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(147, 51, 234, 0.4);
        }

        .result-area {
            position: relative;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: #000;
            color: #00ff41; /* لون المبرمجين الأخضر */
            border: 1px solid #2d2d3f;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            resize: none;
            direction: ltr; /* الكود يظهر من اليسار */
        }

        .copy-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255,255,255,0.1);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 5px;
        }

        .footer-rights {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>أداة الحسني لسحب الهيكلية</h1>
            <p>ادخل رابط الموقع واضغط "تحليل" للحصول على كود الـ HTML</p>
        </div>

        <div class="input-group">
            <input type="text" id="siteUrl" placeholder="https://example.com" dir="ltr">
            <button onclick="cloneSite()">تحليل الهيكل</button>
        </div>

        <div class="result-area">
            <button class="copy-btn" onclick="copyCode()">نسخ الكود</button>
            <textarea id="output" readonly placeholder="الكود سيظهر هنا..."></textarea>
        </div>

        <center>
            <div class="footer-rights">تم التطوير بواسطة حسين الحسني &copy; 2026</div>
        </center>
    </div>

    <script>
        async function cloneSite() {
            const url = document.getElementById('siteUrl').value;
            const output = document.getElementById('output');
            
            if (!url) {
                alert("يرجى إدخال الرابط أولاً!");
                return;
            }

            output.value = "جاري جلب البيانات وتحليل الهيكل... يرجى الانتظار";

            try {
                // نستخدم بروكسي AllOrigins لتجاوز حماية CORS وسحب البيانات
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`;
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (data.contents) {
                    // عرض الكود المسحوب
                    output.value = data.contents;
                } else {
                    output.value = "فشل التحليل. تأكد من صحة الرابط أو جرب موقعاً آخر.";
                }
            } catch (error) {
                output.value = "حدث خطأ: " + error.message;
            }
        }

        function copyCode() {
            const text = document.getElementById('output');
            text.select();
            document.execCommand('copy');
            alert("تم نسخ الكود بنجاح!");
        }
    </script>
</body>
</html>
