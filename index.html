<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HASSANY - PRO LEAGUE 2026</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Oswald:wght@700&display=swap');
        
        :root { 
            --primary: #ffd700; 
            --secondary: #ff4444;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-strong: rgba(0, 0, 0, 0.6);
            --border: rgba(255, 255, 255, 0.1);
            --neon-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at top right, #1a1a1a, #000);
            color: #fff; 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* تأثير الخلفية المتحركة */
        body::before {
            content: "";
            position: fixed;
            top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.03) 0%, transparent 50%);
            animation: rotateBg 20s linear infinite;
            z-index: -1;
        }
        @keyframes rotateBg { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* الهيدر الجديد - Ultra Modern */
        .top-bar {
            background: var(--glass-strong);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }

        .brand-logo { font-family: 'Oswald', sans-serif; letter-spacing: 2px; }
        .brand-logo span { color: var(--secondary); font-size: 0.7rem; display: block; line-height: 1; }
        .brand-logo h1 { margin: 0; font-size: 1.4rem; color: #fff; font-weight: 900; }

        #countdown {
            background: linear-gradient(45deg, #000, #222);
            padding: 8px 15px;
            border-radius: 50px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: monospace;
            font-weight: 900;
            box-shadow: var(--neon-shadow);
        }

        /* شريط التنقل العلوي الأنيق */
        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            overflow-x: auto;
            white-space: nowrap;
        }
        .nav-btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: #ccc;
            padding: 10px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }
        .nav-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }

        /* الحاويات */
        .content-area { padding: 0 15px 50px 15px; max-width: 600px; margin: auto; }
        
        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .card-header { 
            display: flex; align-items: center; gap: 10px; margin-bottom: 20px; 
            border-right: 4px solid var(--primary); padding-right: 10px;
        }
        .card-header h2 { margin: 0; font-size: 1.1rem; font-weight: 900; }

        /* ترتيب الدوري الجديد - نظام الصفوف المتفاعلة */
        .league-row {
            display: grid;
            grid-template-columns: 40px 1fr 40px 40px;
            align-items: center;
            background: rgba(255,255,255,0.03);
            margin-bottom: 8px;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .league-row:hover { transform: scale(1.02); background: rgba(255,255,255,0.07); }
        .league-row.leader {
            border-color: var(--primary);
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), transparent);
            position: relative;
        }
        .league-row.leader::after {
            content: "👑"; position: absolute; left: 10px; font-size: 0.8rem;
        }

        /* بطاقات اللاعبين والمباريات */
        .match-ticket {
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            border-left: 5px solid var(--primary);
        }
        
        .player-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--glass);
            padding: 12px;
            border-radius: 18px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .player-item i { color: var(--primary); background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px; }

        /* شريط الأخبار المتحرك سفلياً */
        .ticker-bottom {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: var(--secondary); color: #fff;
            padding: 5px 0; font-weight: 900; font-size: 0.8rem;
            z-index: 2000; overflow: hidden;
        }
        .ticker-move { display: inline-block; white-space: nowrap; animation: moveNews 20s linear infinite; }
        @keyframes moveNews { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

        /* نافذة المعلومات */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 3000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #111; border: 2px solid var(--primary); padding: 30px; border-radius: 30px; width: 100%; text-align: center; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="top-bar">
    <div class="brand-logo">
        <span>POWERED BY</span>
        <h1>HASSANY 365</h1>
    </div>
    <div id="countdown">00:00:00</div>
</div>

<nav class="nav-tabs">
    <div class="nav-btn active" onclick="switchPage('home', this)"><i class="fas fa-th-large"></i> الرئيسية</div>
    <div class="nav-btn" onclick="switchPage('matches', this)"><i class="fas fa-gamepad"></i> المباريات</div>
    <div class="nav-btn" onclick="switchPage('awards', this)"><i class="fas fa-crown"></i> الجوائز</div>
    <div class="nav-btn" onclick="switchPage('players', this)"><i class="fas fa-users"></i> اللاعبين</div>
</nav>

<div class="content-area">
    <!-- الصفحة الرئيسية -->
    <div id="home-page">
        <div class="card">
            <div class="card-header"><i class="fas fa-chart-line"></i><h2>ترتيب الصدارة</h2></div>
            <div id="league-content"></div>
        </div>
        
        <div class="card">
            <div class="card-header"><i class="fas fa-globe-americas"></i><h2>التصنيف العالمي</h2></div>
            <div id="world-rank-content"></div>
        </div>
    </div>

    <!-- صفحة المباريات -->
    <div id="matches-page" class="hidden">
        <div class="card">
            <div class="card-header"><i class="fas fa-calendar-day"></i><h2>المواجهات القادمة</h2></div>
            <div id="matches-content"></div>
        </div>
    </div>

    <!-- صفحة الجوائز -->
    <div id="awards-page" class="hidden">
        <div id="motm-content"></div>
        <div class="card">
            <div class="card-header"><i class="fas fa-fire"></i><h2>قائمة الهدافين</h2></div>
            <div id="scorers-content"></div>
        </div>
    </div>

    <!-- صفحة اللاعبين -->
    <div id="players-page" class="hidden">
        <div id="players-content"></div>
    </div>
</div>

<div class="ticker-bottom">
    <div class="ticker-move" id="news-text">جاري جلب آخر التحديثات من الخادم...</div>
</div>

<div class="modal" id="pModal" onclick="this.style.display='none'">
    <div class="modal-content">
        <h2 id="mName" style="color:var(--primary)"></h2>
        <p id="mInfo" style="color:#bbb"></p>
    </div>
</div>

<script>
    const url = "https://docs.google.com/spreadsheets/d/1-MToSjxxd5GTvmghx0MxkZJmU0gXOZbDPCt8-Q45Db8/export?format=csv";

    function switchPage(pageId, btn) {
        ['home', 'matches', 'awards', 'players'].forEach(id => {
            document.getElementById(id + '-page').classList.add('hidden');
        });
        document.getElementById(pageId + '-page').classList.remove('hidden');
        
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        window.scrollTo(0,0);
    }

    function openP(n, i) { 
        document.getElementById('mName').innerText = n; 
        document.getElementById('mInfo').innerText = i; 
        document.getElementById('pModal').style.display = 'flex'; 
    }

    async function fetchData() {
        try {
            const r = await fetch(url);
            const data = await r.text();
            const rows = data.split('\n').map(row => row.split(',').map(c => c.replace(/"/g, '').trim()));

            // أخبار
            document.getElementById('news-text').innerText = rows[1][21] || "HASSANY LEAGUE 2026";

            // ترتيب الدوري (تصميم الصفوف)
            let teams = rows.slice(1).map(r => ({ n: r[0], p: r[1], s: parseInt(r[5]) || 0 }))
                        .filter(x => x.n && x.n !== "الفريق").sort((a,b) => b.s - a.s);
            
            let leagueHTML = `<div style="display:grid; grid-template-columns: 40px 1fr 40px 40px; padding: 10px; color:#777; font-size:0.8rem"><div>#</div><div>الفريق</div><div>لعب</div><div>نقاط</div></div>`;
            teams.forEach((t, i) => {
                leagueHTML += `
                <div class="league-row ${i==0?'leader':''}">
                    <div style="font-weight:900; color:${i==0?'var(--primary)':'#777'}">${i+1}</div>
                    <div style="font-weight:700">${t.n}</div>
                    <div>${t.p}</div>
                    <div style="color:var(--primary); font-weight:900">${t.s}</div>
                </div>`;
            });
            document.getElementById('league-content').innerHTML = leagueHTML;

            // التصنيف العالمي
            let wrHTML = "";
            for(let i=1; i<=5; i++) if(rows[i][8]) {
                wrHTML += `<div class="player-item"><i>${i}</i> <b>${rows[i][8]}</b> <span style="margin-right:auto; color:var(--primary)">${rows[i][9]}</span></div>`;
            }
            document.getElementById('world-rank-content').innerHTML = wrHTML;

            // المباريات
            let mxHTML = "";
            for(let i=1; i<=15; i++) if(rows[i][17]) {
                mxHTML += `<div class="match-ticket">
                    <div style="color:var(--primary); font-size:0.7rem; margin-bottom:10px;">${rows[i][20]}</div>
                    <div style="font-size:1.2rem; font-weight:900">${rows[i][17]} VS ${rows[i][18]}</div>
                    <div style="color:#777; font-size:0.8rem; margin-top:5px">${rows[i][19]}</div>
                </div>`;
            }
            document.getElementById('matches-content').innerHTML = mxHTML;

            // الجوائز ورجل المباراة
            if(rows[1][16]) {
                document.getElementById('motm-content').innerHTML = `
                <div class="card" style="border-color:var(--primary); background:linear-gradient(to bottom, rgba(255,215,0,0.1), transparent)">
                    <div class="card-header" style="border:none; justify-content:center; flex-direction:column">
                        <img src="${rows[0][15]}" style="width:100px; height:100px; border-radius:50%; border:3px solid var(--primary); object-fit:cover">
                        <span style="color:var(--primary); font-size:0.8rem; letter-spacing:2px; margin-top:10px">PLAYER OF THE ROUND</span>
                        <h2 style="font-size:1.8rem">${rows[1][16]}</h2>
                    </div>
                </div>`;
            }

            // اللاعبين
            let plHTML = "";
            for(let i=1; i<=12; i++) if(rows[i][24]) {
                plHTML += `<div class="player-item" onclick="openP('${rows[i][24]}', '${rows[i][25]}')">
                    <i class="fas fa-shield-halved"></i>
                    <span>${rows[i][24]}</span>
                    <i class="fas fa-chevron-left" style="margin-right:auto; font-size:0.8rem; opacity:0.3"></i>
                </div>`;
            }
            document.getElementById('players-content').innerHTML = plHTML;

        } catch (e) { console.log(e); }
    }

    // العد التنازلي
    setInterval(() => {
        const target = new Date("Apr 14, 2026 16:00:00").getTime();
        const diff = target - new Date().getTime();
        if (diff < 0) { document.getElementById("countdown").innerText = "LIVE NOW"; }
        else {
            const h = Math.floor(diff / (1000*60*60));
            const m = Math.floor((diff % (1000*60*60)) / (1000*60));
            const s = Math.floor((diff % (1000*60)) / 1000);
            document.getElementById("countdown").innerText = `${h}:${m}:${s}`;
        }
    }, 1000);

    fetchData();
    setInterval(fetchData, 30000);
</script>

</body>
</html>
