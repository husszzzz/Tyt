<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FileMaster Pro - مدير الملفات الذكي</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap');

        :root {
            --accent: #007AFF; /* لون آيفون الأزرق */
            --bg: #F2F2F7;
            --card-bg: #FFFFFF;
            --text-main: #1C1C1E;
            --text-muted: #8E8E93;
            --danger: #FF3B30;
            --success: #34C759;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }

        /* الهيدر العلوي */
        .app-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            padding: 20px;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #D1D1D6;
        }
        .app-header h1 { margin: 0; font-size: 1.5rem; font-weight: 800; }

        /* منطقة الملفات */
        .container { padding: 15px; }
        .file-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

        /* بطاقة الملف */
        .file-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            display: flex; align-items: center; gap: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
            animation: slideIn 0.4s ease-out;
        }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .file-icon {
            width: 50px; height: 50px; background: #E5E5EA;
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: var(--accent);
        }

        .file-info { flex: 1; }
        .file-name { font-weight: 600; font-size: 1rem; display: block; }
        .file-meta { font-size: 0.8rem; color: var(--text-muted); }

        /* قائمة الإجراءات */
        .file-actions { display: flex; gap: 10px; }
        .action-btn {
            background: none; border: none; font-size: 1.2rem; cursor: pointer;
            color: var(--text-muted); padding: 5px;
        }
        .action-btn:hover { color: var(--accent); }
        .action-btn.delete:hover { color: var(--danger); }

        /* نافذة تحويل الصيغة */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            display: none; align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(5px);
        }
        .modal-box {
            background: var(--card-bg); width: 90%; max-width: 400px;
            border-radius: 24px; padding: 25px; text-align: center;
        }
        .modal-box input {
            width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px;
            border: 1px solid #D1D1D6; font-family: 'Cairo';
        }

        /* شريط التحكم السفلي */
        .bottom-bar {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px; background: #1C1C1E; border-radius: 50px;
            padding: 10px 20px; display: flex; justify-content: space-around;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); z-index: 500;
        }
        .nav-item { color: #fff; text-align: center; cursor: pointer; opacity: 0.7; }
        .nav-item.active { opacity: 1; color: var(--accent); }
        .nav-item i { font-size: 1.4rem; display: block; }
        .nav-item span { font-size: 0.7rem; font-weight: bold; }

        /* زر الإضافة العائم */
        .add-btn {
            width: 55px; height: 55px; background: var(--accent); color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,122,255,0.4);
            transform: translateY(-30px);
        }

        .link-badge {
            background: #E8F2FF; color: var(--accent); padding: 2px 8px;
            border-radius: 6px; font-size: 0.7rem; font-weight: bold; margin-top: 5px; display: inline-block;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <h1>ملفاتي</h1>
        <div style="color: var(--accent); font-weight: 600;"><i class="fas fa-search"></i></div>
    </header>

    <div class="container">
        <div id="fileList" class="file-grid">
            </div>
    </div>

    <div class="modal" id="convertModal">
        <div class="modal-box">
            <h3 id="targetFileName">تغيير امتداد الملف</h3>
            <p style="font-size: 0.8rem; color: var(--text-muted);">أدخل الامتداد الجديد (مثال: pdf, jpg, mp4)</p>
            <input type="text" id="newExtInput" placeholder="مثلاً: pdf">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeModal()" style="flex:1; padding: 12px; border:none; border-radius: 12px;">إلغاء</button>
                <button onclick="applyConversion()" style="flex:1; padding: 12px; border:none; border-radius: 12px; background: var(--accent); color:#fff;">تغيير وحفظ</button>
            </div>
        </div>
    </div>

    <div class="modal" id="linkModal">
        <div class="modal-box">
            <i class="fas fa-link" style="font-size: 2rem; color: var(--accent);"></i>
            <h3>رابط التحميل المباشر</h3>
            <div id="directLinkArea" style="background:#f0f0f0; padding:15px; border-radius:12px; word-break: break-all; margin:15px 0; font-size:0.9rem;"></div>
            <button onclick="copyLink()" style="width:100%; padding: 12px; border:none; border-radius: 12px; background: var(--accent); color:#fff;">نسخ الرابط</button>
        </div>
    </div>

    <nav class="bottom-bar">
        <div class="nav-item active"><i class="fas fa-folder"></i><span>الرئيسية</span></div>
        <button class="add-btn" onclick="triggerUpload()"><i class="fas fa-plus"></i></button>
        <div class="nav-item"><i class="fas fa-cloud"></i><span>السحابة</span></div>
        <input type="file" id="fileInput" hidden onchange="handleFile(event)">
    </nav>

    <script>
        let files = [];
        let currentEditingId = null;

        function triggerUpload() { document.getElementById('fileInput').click(); }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const fileObj = {
                id: Date.now(),
                name: file.name,
                size: (file.size / 1024).toFixed(1) + " KB",
                type: file.name.split('.').pop(),
                link: `https://download.filemaster.pro/u/${Math.random().toString(36).substring(7)}`
            };

            files.push(fileObj);
            renderFiles();
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.length ? '' : '<div style="text-align:center; margin-top:50px; color:#8e8e93;">لا توجد ملفات حالياً</div>';
            
            files.forEach(file => {
                list.innerHTML += `
                    <div class="file-card">
                        <div class="file-icon"><i class="fas fa-file-code"></i></div>
                        <div class="file-info">
                            <span class="file-name">${file.name}</span>
                            <span class="file-meta">${file.size} • ${file.type.toUpperCase()}</span>
                            <br><span class="link-badge"><i class="fas fa-globe"></i> رابط مباشر متاح</span>
                        </div>
                        <div class="file-actions">
                            <button class="action-btn" onclick="showLink('${file.link}')" title="رابط التحميل"><i class="fas fa-download"></i></button>
                            <button class="action-btn" onclick="openConvertModal(${file.id})" title="تغيير الامتداد"><i class="fas fa-exchange-alt"></i></button>
                            <button class="action-btn delete" onclick="deleteFile(${file.id})"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function openConvertModal(id) {
            currentEditingId = id;
            const file = files.find(f => f.id === id);
            document.getElementById('targetFileName').innerText = `تحويل: ${file.name}`;
            document.getElementById('convertModal').style.display = 'flex';
        }

        function applyConversion() {
            const newExt = document.getElementById('newExtInput').value.trim().replace('.', '');
            if (!newExt) return;

            files = files.map(f => {
                if (f.id === currentEditingId) {
                    let baseName = f.name.substring(0, f.name.lastIndexOf('.'));
                    return { ...f, name: baseName + '.' + newExt, type: newExt };
                }
                return f;
            });

            closeModal();
            renderFiles();
            alert("تم تغيير الامتداد بنجاح! يمكنك الآن حفظ الملف بالصيغة الجديدة.");
        }

        function showLink(link) {
            document.getElementById('directLinkArea').innerText = link;
            document.getElementById('linkModal').style.display = 'flex';
        }

        function deleteFile(id) {
            files = files.filter(f => f.id !== id);
            renderFiles();
        }

        function closeModal() {
            document.getElementById('convertModal').style.display = 'none';
            document.getElementById('linkModal').style.display = 'none';
        }

        function copyLink() {
            const link = document.getElementById('directLinkArea').innerText;
            navigator.clipboard.writeText(link);
            alert("تم نسخ رابط التحميل المباشر!");
            closeModal();
        }
    </script>
</body>
</html>
